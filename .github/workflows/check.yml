name: check

on:
  pull_request:
  workflow_dispatch: # pnpm check:stack --remote starts it on each branch of a stack
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: pnpm check
        env:
          CRASH_ITERATIONS: 5
